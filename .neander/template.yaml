contract_version: 1
id: fold
title: Fold
description: |
  **Build forms that adapt to answers and route new responses.**

  Fold is a single-owner workspace for feedback, enquiries and registrations. Start from a blank form or an editable example, group questions into pages, and reveal follow-up questions based on an earlier answer. Preview changes before publishing a link or iframe.

  Search responses, review answer summaries and export a CSV. Original question snapshots stay with each response. With provider setup, opt into email alerts with a private response link or sync selected fields from new submissions to an authorized Google spreadsheet. Delivery activity shows successes, failures and retry controls.

  The template comes with fictional feedback and workshop forms, five sample responses and a project enquiry draft. Password recovery, response alerts and Sheets sync are optional and require their respective provider configuration.
category: Forms & Surveys
best_for: Individuals collecting feedback, enquiries and event registrations
features:
  - Twelve question and content block types
  - Multi-page forms with conditional follow-up questions
  - Feedback, workshop and enquiry starters
  - Autosaved drafts, live preview and explicit publishing
  - Three visual presets, public links and iframe embeds
  - Response search, date filters, summaries and CSV export
  - Historical answer snapshots and form duplication, archive and restore
  - Opt-in alerts to the verified owner's inbox
  - Selected-field Google Sheets sync with delivery status and retry
included:
  - Fold form builder and private response workspace
  - PostgreSQL migrations and session authentication
  - Fictional forms and five sample responses
  - Optional password recovery setup guide
  - Setup guides for owner alerts and Google Sheets
